<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | WindGuard AI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <span class="icon">🌀</span>
                <h1>WindGuard <span>AI</span></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="history.html">Historical Analysis</a></li>
                    <li class="active"><a href="settings.html">Settings</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <p>Status: <span id="api-status">Connecting...</span></p>
            </div>
        </aside>

        <main class="content">
            <header>
                <div class="header-left">
                    <h2>Settings</h2>
                    <p id="current-time">System Configuration</p>
                </div>
            </header>

            <section class="glass" style="padding: 24px;">
                <h3>Global Configuration</h3>
                <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 0.9rem;">Application settings
                    and default physical constraints.</p>

                <div style="display: flex; flex-direction: column; gap: 16px; max-width: 400px;">
                    <div class="input-group">
                        <label>Default Output Capacity Cap (MW)</label>
                        <input type="number" id="setting-default-capacity" value="50">
                        <small style="color: var(--text-muted); display: block; margin-top: 4px;">Softcap for system
                            warnings.</small>
                    </div>

                    <div class="input-group">
                        <label>High Risk Threshold (%)</label>
                        <input type="number" id="setting-risk-threshold" value="70">
                        <small style="color: var(--text-muted); display: block; margin-top: 4px;">Probability mark
                            for strict curtailment alerts.</small>
                    </div>

                    <div style="margin-top: 16px;">
                        <button class="btn-primary" onclick="alert('Settings saved locally.')" style="width: 100%;">Save
                            Settings</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
