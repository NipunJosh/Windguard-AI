<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WindGuard AI | Power Decision Support</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <span class="icon">🌀</span>
                <h1>WindGuard <span>AI</span></h1>
            </div>
            <nav>
                <ul id="nav-menu">
                    <li class="active"><a href="index.html">Dashboard</a></li>
                    <li><a href="history.html">Historical Analysis</a></li>
                    <li><a href="settings.html">Settings</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <p>Status: <span id="api-status">Connecting...</span></p>
            </div>
        </aside>

        <main class="content">
            <header>
                <div class="header-left">
                    <h2>Operational Dashboard</h2>
                    <p id="current-time">Real-time system monitoring</p>
                </div>
                <div class="header-right">
                    <button id="refresh-btn" class="btn-primary">Sync Data</button>
                </div>
            </header>

            <!-- PAGE: DASHBOARD -->
            <div id="page-dashboard">
                <section class="input-panel glass">
                    <div class="input-group">
                        <label>Plant Location</label>
                        <input type="text" id="location-input" list="city-list" value="Coimbatore, IN">
                        <datalist id="city-list">
                        </datalist>
                    </div>
                    <div class="input-group">
                        <label>Capacity (MW)</label>
                        <input type="number" id="capacity-input" value="50">
                    </div>
                    <div class="input-group">
                        <label>Transformer (MW)</label>
                        <input type="number" id="transformer-input" value="45">
                    </div>
                    <div class="input-group">
                        <label>Time Range</label>
                        <select id="time-range-select">
                            <option value="current">Current (Live Data)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Price Override (INR)</label>
                        <input type="number" id="price-input" placeholder="Optional">
                    </div>
                </section>

                <section class="kpi-grid" id="kpi-containers">
                    <!-- KPI Cards injected here -->
                </section>

                <div class="dashboard-secondary">
                    <section class="recommendations glass">
                        <h3>Operational Recommendations</h3>
                        <div id="recs-list" class="recs-list">
                            <!-- Recs injected here -->
                        </div>
                    </section>

                    <section class="risk-card glass">
                        <h3>Estimated Risk Profile</h3>
                        <div class="risk-meter-container">
                            <div id="risk-meter" class="risk-meter"></div>
                            <p id="risk-label">Analyzing...</p>
                        </div>
                        <div class="chart-mini" id="mini-chart">
                            <!-- Chart placeholder -->
                        </div>
                    </section>
                </div>
            </div>

        </main>
    </div>

    <!-- Floating Chatbot UI -->
    <div class="chatbot-container">
        <button id="chatbot-toggle" class="chatbot-toggle-btn">💬</button>
        <div id="chatbot-window" class="chatbot-window hidden">
            <div class="chatbot-header">
                <h3>WindGuard Assistant</h3>
                <button id="chatbot-close" class="close-btn">&times;</button>
            </div>
            <div id="chatbot-messages" class="chatbot-messages">
                <div class="message ai">Hello! I am the WindGuard assistant. How can I help you?</div>
            </div>
            <div class="chatbot-input-area">
                <input type="text" id="chatbot-input" placeholder="Ask about wind energy...">
                <button id="chatbot-send" class="btn-primary">Send</button>
            </div>
        </div>
    </div>

    <script src="districts.js"></script>
    <script src="app.js"></script>
</body>

</html>
